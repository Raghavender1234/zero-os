name: ZeroOS Framework & Architecture CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'aosp/**'
      - 'app/**'
      - '.github/workflows/build_aosp_gsi.yml'
    tags:
      - 'v*'

jobs:
  validate-framework-and-patches:
    name: Validate Patches, Manifest & Architecture
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ZeroOS Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Validate AOSP Manifest & Patches Syntax
        run: |
          echo "Validating AOSP Manifest syntax..."
          test -f aosp/manifests/zero_os.xml
          
          echo "Validating Framework Integration Patches..."
          test -f aosp/patches/frameworks_base/0001-ZeroActivityManagerHook-integration.patch
          test -f aosp/patches/frameworks_base/0002-ZeroAppOpsHook-integration.patch
          
          # Verify patches contain both checkOperation and noteOperation hooks
          grep "checkOperationUnchecked" aosp/patches/frameworks_base/0002-ZeroAppOpsHook-integration.patch
          grep "evalMode" aosp/patches/frameworks_base/0002-ZeroAppOpsHook-integration.patch

      - name: Validate Emulator and Device Tree Configs
        run: |
          echo "Validating Emulator Product Definitions..."
          test -f aosp/device/zero/zero_emulator/AndroidProducts.mk
          test -f aosp/device/zero/zero_emulator/zero_emulator.mk
          
          echo "Validating GSI Product Definitions..."
          test -f aosp/device/zero/zero_arm64/AndroidProducts.mk
          test -f aosp/device/zero/zero_arm64/zero_arm64.mk
          
          echo "Validating Samsung A15 Tree..."
          test -f aosp/device/samsung/a15/AndroidProducts.mk
          test -f aosp/device/samsung/a15/a15.mk

      - name: Validate System Packages & Soong Blueprints
        run: |
          test -f aosp/packages/apps/ZeroLauncher/Android.bp
          test -f aosp/packages/apps/ZeroLauncher/privapp-permissions-zeroos.xml
          test -f aosp/packages/apps/ZeroStore/Android.bp
          test -f aosp/packages/apps/ZeroStore/privapp-permissions-zerostore.xml

      - name: Verify & Generate AVB 2.0 Cryptographic Keys
        run: |
          chmod +x aosp/tools/*.sh aosp/scripts/*.sh
          bash aosp/tools/generate_keys.sh
          test -f aosp/keys/avb_pkmd.bin
          test -f aosp/keys/releasekey.pk8
          ls -la aosp/keys/

  compile-launcher-shell:
    name: Compile ZeroLauncher Android Application
    runs-on: ubuntu-latest
    needs: validate-framework-and-patches
    steps:
      - name: Checkout ZeroOS Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Compile ZeroLauncher Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            echo "Gradle wrapper not present."
          fi

      - name: Upload Launcher Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ZeroLauncher-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
