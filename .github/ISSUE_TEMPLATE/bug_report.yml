name: "🐛 Bug Report"
description: "Report a software glitch, hardware issue, or unexpected behavior"
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: "Thanks for taking the time to report an issue in ZeroOS!"
  - type: input
    id: device_model
    attributes:
      label: "Device Model & Codename"
      description: "e.g., Google Pixel 7 (panther), Nothing Phone 2 (pong)"
      placeholder: "e.g., Pixel 7"
    validations:
      required: true
  - type: dropdown
    id: installation_method
    attributes:
      label: "Installation Method"
      options:
        - "1-Click Fastboot Script (flash_phone.bat / .sh)"
        - "WebUSB Browser Flasher"
        - "DSU Sideloader (Dual-Boot)"
        - "Custom Recovery (TWRP / OrangeFox)"
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: "Expected Behavior"
      description: "What did you expect to happen?"
    validations:
      required: true
  - type: textarea
    id: actual_behavior
    attributes:
      label: "Actual Behavior"
      description: "What actually happened?"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "Logcat / Terminal Output"
      description: "Attach relevant `adb logcat` output if applicable"
      render: shell
